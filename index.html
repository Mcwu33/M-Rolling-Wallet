<!DOCTYPE html>
<html lang="en" class="dark"> <!-- 可通过 JS 切换 dark/light -->
<head>
    <meta charset="UTF-8">
    <title>Rolling-wallet</title>
    <!-- 引入 Tailwind CSS 快速写出高级感 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#C5A059', dark: '#AA7C11' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-800 dark:text-gray-100 min-h-screen p-6 transition-colors duration-300">

    <div class="max-w-md mx-auto space-y-6">
        <!-- 头部总资产看板 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
            <div class="text-sm text-gray-400 mb-1">Left Balance (剩余总额)</div>
            <div class="flex items-center justify-between">
                <div id="balance-display" class="text-3xl font-bold text-gold-light dark:text-gold-dark">
                    RM 10,000.00
                </div>
                <div class="flex items-center space-x-3">
                    <!-- 眼睛图标：切换显示/隐藏 -->
                    <button id="toggle-mask" class="text-gray-400 hover:text-gray-600">👁️</button>
                    <!-- 小铅笔：修改本金 -->
                    <button id="edit-balance" class="text-gray-400 hover:text-gray-600">✏️</button>
                </div>
            </div>
        </div>

        <!-- 添加流水表单 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-3">
            <div class="font-medium text-sm text-gray-500">添加新流水</div>
            <input type="text" id="item-name" placeholder="项目名称 (例如: 咖啡)" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
            <div class="flex space-x-2">
                <input type="number" id="item-amount" placeholder="金额" class="w-1/2 px-3 py-2 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
                <select id="item-type" class="w-1/2 px-3 py-2 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
                    <option value="spend">支出 (Spend -)</option>
                    <option value="gain">收入 (Gain +)</option>
                </select>
            </div>
            <button onclick="addItem()" class="w-full py-2 bg-gold-light dark:bg-gold-dark text-white rounded-xl font-medium text-sm shadow-md">
                确认添加
            </button>
        </div>

        <!-- 动态 Column 列表 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
            <div class="font-medium text-sm text-gray-500 mb-3">近期流水明细</div>
            <div id="transaction-list" class="space-y-2">
                <!-- 动态生成的列表项会在这里展示 -->
            </div>
        </div>
    </div>

</body>
</html>
