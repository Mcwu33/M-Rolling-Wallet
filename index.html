<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling-wallet</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#C5A059', dark: '#AA7C11' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-800 dark:text-gray-100 min-h-screen p-4 sm:p-6 transition-colors duration-300">

    <div class="max-w-md mx-auto space-y-5">
        
        <!-- 头部：标题与模式切换 -->
        <div class="flex justify-between items-center px-1">
            <h1 class="text-xl font-bold tracking-wider text-gold-light dark:text-gold-dark">Rolling-Wallet</h1>
            <!-- 手机端手动切换日间/夜间按钮 -->
            <button onclick="toggleDarkMode()" class="text-xs px-3 py-1 bg-gray-200 dark:bg-[#2A2A2A] rounded-full">
                ☀️ / 🌙
            </button>
        </div>

        <!-- 头部资产总额面板 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
            <div class="text-xs text-gray-400 mb-1">Left Balance (剩余总额)</div>
            <div class="flex items-center justify-between">
                <div id="balance-display" class="text-3xl font-bold text-gold-light dark:text-gold-dark">
                    RM 0.00
                </div>
                <div class="flex items-center space-x-3 text-lg">
                    <!-- 眼睛图标：切换隐私屏蔽 -->
                    <button id="toggle-mask" onclick="toggleMask()" class="text-gray-400 hover:text-gray-600 focus:outline-none">👁️</button>
                    <!-- 小铅笔：修改初始本金 -->
                    <button onclick="editInitialBalance()" class="text-gray-400 hover:text-gray-600 focus:outline-none">✏️</button>
                </div>
            </div>
        </div>

        <!-- 添加流水表单 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-3">
            <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">添加新流水</div>
            <input type="text" id="item-name" placeholder="项目名称 (e.g. 咖啡)" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
            <div class="flex space-x-2">
                <input type="number" id="item-amount" placeholder="金额 (e.g. 3000)" class="w-1/2 px-3 py-2.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                <select id="item-type" class="w-1/2 px-3 py-2.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                    <option value="spend">支出 (Spend -)</option>
                    <option value="gain">收入 (Gain +)</option>
                </select>
            </div>
            <!-- 新增：支持自选日期 -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-400">日期:</span>
                <input type="date" id="item-date" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
            </div>
            <button onclick="addItem()" class="w-full py-3 bg-gold-light dark:bg-gold-dark text-white rounded-xl font-medium text-sm shadow-md active:scale-95 transition-transform">
                确认添加
            </button>
        </div>

        <!-- 📅 日历筛选与流水明细 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-3">
            <div class="flex justify-between items-center">
                <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">流水明细与日历筛选</div>
                <!-- 按日期筛选 -->
                <div class="flex items-center space-x-1">
                    <input type="date" id="filter-date" onchange="renderTransactions()" class="px-2 py-1 bg-gray-50 dark:bg-[#2A2A2A] rounded-lg text-xs border-none">
                    <button onclick="clearFilter()" class="text-xs text-gold-light dark:text-gold-dark px-1">重置</button>
                </div>
            </div>
            
            <div id="transaction-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                <!-- 动态生成的列表项 -->
            </div>
        </div>

    </div>

    <!-- JavaScript 核心逻辑 -->
    <script>
        // 初始化数据
        let initialBalance = parseFloat(localStorage.getItem('rw_initial')) || 0;
        let transactions = JSON.parse(localStorage.getItem('rw_transactions')) || [];
        let isMasked = false;

        // 页面加载完成后自动填入今天的日期
        document.getElementById('item-date').valueAsDate = new Date();

        function saveData() {
            localStorage.setItem('rw_initial', initialBalance);
            localStorage.setItem('rw_transactions', JSON.stringify(transactions));
            renderTransactions();
        }

        // 修改初始本金
        function editInitialBalance() {
            let val = prompt("请输入您的初始总金额 (Left Balance):", initialBalance);
            if (val !== null && !isNaN(val)) {
                initialBalance = parseFloat(val);
                saveData();
            }
        }

        // 切换隐私遮挡
        function toggleMask() {
            isMasked = !isMasked;
            document.getElementById('toggle-mask').textContent = isMasked ? '🔒' : '👁️';
            renderTransactions(); // 重新渲染以更新总额显示
        }

        // 添加流水
        function addItem() {
            let name = document.getElementById('item-name').value.trim();
            let amount = parseFloat(document.getElementById('item-amount').value);
            let type = document.getElementById('item-type').value;
            let date = document.getElementById('item-date').value;

            if (!name || isNaN(amount) || amount <= 0) {
                alert("请输入有效的项目名称和金额！");
                return;
            }

            let newItem = {
                id: Date.now(),
                name,
                amount,
                type,
                date: date || new Date().toISOString().split('T')[0]
            };

            transactions.unshift.call(transactions, newItem); // 加
