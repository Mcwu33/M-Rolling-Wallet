<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M-Rolling-Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #7b5ea7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .app-card {
            background: rgba(60, 42, 90, 0.75);
            backdrop-filter: blur(10px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }
        .page-transition {
            animation: fadeIn 0.2s ease-in-out;
        }
        #pullRefreshIndicator {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between max-w-md mx-auto text-white overflow-hidden">

    <!-- 下拉刷新提示浮层 -->
    <div id="pullRefreshIndicator" class="absolute top-0 left-0 right-0 z-50 flex items-center justify-center py-3 text-xs text-yellow-300 font-bold bg-purple-950/90 border-b border-yellow-400/30 shadow-lg -translate-y-full opacity-0 pointer-events-none">
        <span id="pullRefreshText" class="flex items-center space-x-2">
            <span>🔄</span> <span>下拉刷新钱包 (Release to Refresh)...</span>
        </span>
    </div>

    <!-- 主内容区域 -->
    <div id="mainContent" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20 page-transition relative"></div>

    <!-- 底部导航栏 (完美恢复双页切换) -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto app-card border-t border-purple-500/30 px-8 py-3 flex justify-around items-center z-30">
        <button onclick="switchPage(1)" id="navBtn1" class="flex flex-col items-center text-yellow-300 transition">
            <span class="text-xl">💰</span>
            <span class="text-[10px] mt-1 font-semibold">Wallet</span>
        </button>
        <button onclick="switchPage(2)" id="navBtn2" class="flex flex-col items-center text-purple-300 hover:text-white transition">
            <span class="text-xl">📊</span>
            <span class="text-[10px] mt-1 font-semibold">Summary</span>
        </button>
    </div>

    <script>
        // --- 核心财务全局状态数据 ---
        let walletState = {
            currentPage: 1,
            transactions: JSON.parse(localStorage.getItem('m_wallet_txs')) || [
                { id: 1, title: "Monthly Rent", amount: 1200, category: "Rent", type: "expense", date: "2026-11-01" },
                { id: 2, title: "Supermarket Groceries", amount: 480, category: "Food", type: "expense", date: "2026-11-03" },
                { id: 3, title: "Restaurant Dining", amount: 320, category: "Food", type: "expense", date: "2026-11-05" },
                { id: 4, title: "Electricity & Water", amount: 250, category: "Utilities", type: "expense", date: "2026-11-08" },
                { id: 5, title: "New Sneakers", amount: 210, category: "Clothes", type: "expense", date: "2026-11-10" },
                { id: 6, title: "Mobile Bill", amount: 150, category: "Phone", type: "expense", date: "2026-11-12" },
                { id: 7, title: "Movie & Leisure", amount: 190, category: "Leisure", type: "expense", date: "2026-11-15" }
            ]
        };

        function saveWalletState() {
            localStorage.setItem('m_wallet_txs', JSON.stringify(walletState.transactions));
        }

        function switchPage(page) {
            walletState.currentPage = page;
            for (let i = 1; i <= 2; i++) {
                const btn = document.getElementById(`navBtn${i}`);
                if (btn) {
                    btn.className = i === page 
                        ? "flex flex-col items-center text-yellow-300 transition" 
                        : "flex flex-col items-center text-purple-300 hover:text-white transition";
                }
            }
            renderWallet();
        }

        function renderWallet() {
            const container = document.getElementById('mainContent');
            if (!container) return;
            if (walletState.currentPage === 1) {
                renderWalletDashboard(container);
            } else if (walletState.currentPage === 2) {
                renderWalletSummary(container);
            }
        }

        // ================= PAGE 1: WALLET DASHBOARD =================
        function renderWalletDashboard(container) {
            const totalExpense = walletState.transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + Number(t.amount), 0);

            container.innerHTML = `
                <div class="flex justify-between items-center pt-1">
                    <div>
                        <h2 class="text-lg font-black tracking-wide text-yellow-300">💰 M-Rolling-Wallet</h2>
                        <p class="text-[10px] text-purple-200">个人财务驾驶舱 • 资产流动控制台</p>
                    </div>
                    <button onclick="addTransaction()" class="bg-yellow-400 text-purple-950 font-black px-3.5 py-2 rounded-xl text-xs shadow-md active:scale-95 transition flex items-center space-x-1">
                        <span>+ 记一笔</span>
                    </button>
                </div>

                <div class="app-card p-4 rounded-2xl border border-yellow-400/40 shadow-xl flex flex-col space-y-1">
                    <span class="text-[10px] text-purple-300 font-semibold uppercase tracking-wider">November Total Expenses (本月总支出)</span>
                    <div class="text-2xl font-black text-yellow-300">RM ${totalExpense.toLocaleString()}</div>
                    <div class="text-[10px] text-purple-200 mt-1">💡 提示：点击底部 Summary 可查看环形分类占比图表</div>
                </div>

                <div class="space-y-2 pb-16">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-xs font-bold tracking-wide">📋 Recent Transactions (近期账目)</h3>
                        <span class="text-[10px] text-purple-300">共 ${walletState.transactions.length} 笔记录</span>
                    </div>

                    ${walletState.transactions.length === 0 ? '<p class="text-[11px] text-purple-300 text-center py-8">暂无账目记录，点击右上角记一笔开始 💰</p>' : ''}
                    
                    ${walletState.transactions.map(t => `
                        <div class="app-card p-3 rounded-xl border border-purple-500/30 flex items-center justify-between shadow-sm">
                            <div class="flex flex-col space-y-0.5 flex-1 mr-2">
                                <span class="text-xs text-white font-bold">${t.title}</span>
                                <div class="flex items-center space-x-2 text-[9px] text-purple-300">
                                    <span class="bg-purple-950/60 px-2 py-0.5 rounded border border-purple-400/20 text-yellow-300">${t.category}</span>
                                    <span>📅 ${t.date}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-black text-red-400">-RM ${Number(t.amount).toLocaleString()}</span>
                                <button onclick="deleteTx(${t.id})" class="text-red-400 hover:text-red-300 text-xs p-1" title="Delete">🗑️</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function addTransaction() {
            const title = prompt("请输入账目名称 (例如: Lunch / Rent):");
            if (!title) return;
            const amountStr = prompt("请输入金额 (RM):");
            if (!amountStr || isNaN(amountStr)) return;
            const category = prompt("请输入分类 (例如: Food, Rent, Utilities, Clothes, Leisure, Phone):", "Food");
            
            const newTx = {
                id: Date.now(),
                title: title.trim(),
                amount: parseFloat(amountStr),
                category: category ? category.trim() : "Other",
                type: "expense",
                date: new Date().toISOString().split('T')[0]
            };

            walletState.transactions.unshift(newTx);
            saveWalletState();
            renderWallet();
        }

        function deleteTx(id) {
            walletState.transactions = walletState.transactions.filter(t => t.id !== id);
            saveWalletState();
            renderWallet();
        }

        // ================= PAGE 2: SUMMARY =================
        function renderWalletSummary(container) {
            const categoryTotals = {};
            let totalExpense = 0;

            walletState.transactions.forEach(t => {
                if (t.type === 'expense') {
                    const cat = t.category || 'Other';
                    const amt = Number(t.amount);
                    categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
                    totalExpense += amt;
                }
            });

            const sortedCategories = Object.keys(categoryTotals).map(cat => {
                const amount = categoryTotals[cat];
                const percentage = totalExpense > 0 ? Math.round((amount / totalExpense) * 100) : 0;
                return { category: cat, amount, percentage };
            }).sort((a, b) => b.amount - a.amount);

            const colors = ['#22d3ee', '#a8a29e', '#fbbf24', '#f97316', '#ef4444', '#ec4899', '#8b5cf6'];

            let cumulativePercent = 0;
            let gradientStops = sortedCategories.map((item, index) => {
                const start = cumulativePercent;
                cumulativePercent += item.percentage;
                const color = colors[index % colors.length];
                return `${color} ${start}% ${cumulativePercent}%`;
            });
            const conicGradientStyle = gradientStops.length > 0 ? `conic-gradient(${gradientStops.join(', ')})` : 'conic-gradient(#4b3271 0% 100%)';

            const topCategory = sortedCategories.length > 0 ? sortedCategories[0].category : 'No Data';

            container.innerHTML = `
                <div class="text-center space-y-1 pt-1">
                    <h2 class="text-lg font-black tracking-wide text-yellow-300">📊 Personal Accounting Summary</h2>
                    <p class="text-[10px] text-purple-200">整月财务支出结构与品类占比分析</p>
                </div>

                <div class="space-y-5 pt-2 pb-16">
                    <div class="app-card p-5 rounded-3xl border border-yellow-400/40 shadow-2xl flex flex-col items-center space-y-4">
                        <div class="text-xs font-extrabold text-yellow-300 uppercase tracking-widest">PERSONAL ACCOUNTING</div>
                        
                        <div class="relative w-48 h-48 rounded-full flex items-center justify-center shadow-inner" style="background: ${conicGradientStyle};">
                            <div class="w-28 h-28 bg-[#3c2a5a] rounded-full flex flex-col items-center justify-center shadow-inner border border-purple-400/30">
                                <span class="text-[10px] text-purple-300 font-semibold">Top Expense</span>
                                <span class="text-xs font-black text-yellow-300 mt-0.5 truncate max-w-[90px] px-1">${topCategory}</span>
                            </div>
                        </div>

                        <div class="text-xs text-purple-200 font-medium">
                            本月总支出: <b class="text-yellow-300">RM ${totalExpense.toLocaleString()}</b>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <div class="flex justify-between items-center px-1">
                            <h3 class="text-xs font-bold text-yellow-300 uppercase tracking-widest">📌 Category Breakdown (品类明细)</h3>
                            <span class="text-[10px] text-purple-300">按金额由高到低</span>
                        </div>

                        ${sortedCategories.length === 0 ? '<div class="app-card p-4 rounded-2xl text-center text-xs text-purple-300 border border-purple-400/30">暂无支出数据 📊</div>' : ''}

                        ${sortedCategories.map((item, index) => {
                            const badgeColor = colors[index % colors.length];
                            return `
                                <div class="app-card p-3.5 rounded-2xl border border-purple-400/30 flex items-center justify-between shadow-md">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${badgeColor};"></div>
                                        <div class="flex flex-col">
                                            <span class="text-xs font-bold text-white">${item.category}</span>
                                            <span class="text-[9px] text-purple-300">占比全月 ${item.percentage}%</span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xs font-black text-yellow-300">RM ${item.amount.toLocaleString()}</div>
                                        <div class="text-[9px] text-purple-300 font-semibold">${item.percentage}%</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // ================= 左右 SWIPE 手势 + 下拉刷新 =================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleWalletSwipe();
        }, false);

        function handleWalletSwipe() {
            const threshold = 50; 
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX) && diffY > 100 && window.scrollY === 0) {
                triggerWalletRefresh();
                return;
            }

            if (Math.abs(diffX) < threshold) return;
            if (diffX < 0) {
                if (walletState.currentPage < 2) switchPage(2);
            } else {
                if (walletState.currentPage > 1) switchPage(1);
            }
        }

        const mainContainer = document.getElementById('mainContent');
        let startY = 0;
        if (mainContainer) {
            mainContainer.addEventListener('touchstart', e => { startY = e.touches[0].pageY; });
            mainContainer.addEventListener('touchend', e => {
                if (mainContainer.scrollTop === 0 && (e.changedTouches[0].pageY - startY > 90)) {
                    triggerWalletRefresh();
                }
            });
        }

        function triggerWalletRefresh() {
            const indicator = document.getElementById('pullRefreshIndicator');
            const textSpan = document.getElementById('pullRefreshText');
            if (!indicator) return;
            textSpan.innerHTML = `<span>⚡</span> <span>正在刷新钱包 (Refreshing)...</span>`;
            indicator.style.transform = "translateY(0)";
            indicator.style.opacity = "1";

            setTimeout(() => {
                renderWallet();
                indicator.style.transform = "translateY(-100%)";
                indicator.style.opacity = "0";
                textSpan.innerHTML = `<span>🔄</span> <span>下拉刷新钱包 (Release to Refresh)...</span>`;
            }, 600);
        }

        document.addEventListener("visibilitychange", function() {
            if (!document.hidden) {
                switchPage(1);
            }
        });

        // 初始化渲染
        renderWallet();
    </script>
</body>
</html>
