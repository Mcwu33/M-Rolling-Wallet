<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M-Rolling-Wallet (Initial Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .wallet-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between max-w-md mx-auto text-white p-4">

    <!-- 顶部资产驾驶舱 -->
    <div class="space-y-4">
        <div class="flex justify-between items-center pt-1">
            <div>
                <h2 class="text-lg font-black tracking-wide text-sky-400">M-Rolling-Wallet</h2>
                <p class="text-[10px] text-slate-400">Initial Minimalist Ledger</p>
            </div>
            <button onclick="addRecord()" class="bg-sky-400 text-slate-950 font-black px-3.5 py-2 rounded-xl text-xs shadow-md active:scale-95 transition">
                + 记一笔
            </button>
        </div>

        <!-- 总支出概览卡片 -->
        <div class="wallet-card p-4 rounded-2xl shadow-xl flex flex-col space-y-1 border border-sky-500/30">
            <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Total Expenses (总支出)</span>
            <div id="totalDisplay" class="text-2xl font-black text-sky-400">RM 0</div>
        </div>

        <!-- 流水账明细列表 -->
        <div class="space-y-2">
            <h3 class="text-xs font-bold tracking-wide text-slate-200">📋 Transactions (流水明细)</h3>
            <div id="recordList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        // 初代最简数据状态
        let records = JSON.parse(localStorage.getItem('initial_wallet_records')) || [];

        function saveRecords() {
            localStorage.setItem('initial_wallet_records', JSON.stringify(records));
        }

        function render() {
            const listContainer = document.getElementById('recordList');
            const totalDisplay = document.getElementById('totalDisplay');

            let total = 0;
            if (records.length === 0) {
                listContainer.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-6">暂无记录，点击右上角开始记账</p>`;
            } else {
                listContainer.innerHTML = records.map(r => {
                    total += Number(r.amount);
                    return `
                        <div class="wallet-card p-3 rounded-xl flex items-center justify-between shadow-sm border border-slate-700/60">
                            <span class="text-xs font-bold text-white">${r.title}</span>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-black text-rose-400">-RM ${r.amount}</span>
                                <button onclick="deleteRecord(${r.id})" class="text-slate-400 hover:text-rose-400 text-xs">🗑️</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            totalDisplay.innerText = `RM ${total.toLocaleString()}`;
        }

        function addRecord() {
            const title = prompt("请输入账目名称:");
            if (!title) return;
            const amount = prompt("请输入金额 (RM):");
            if (!amount || isNaN(amount)) return;

            records.unshift({ id: Date.now(), title: title.trim(), amount: parseFloat(amount) });
            saveRecords();
            render();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            render();
        }

        render();
    </script>
</body>
</html>
