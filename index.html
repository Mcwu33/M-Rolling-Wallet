<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling-Wallet</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#C5A059', dark: '#AA7C11' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-[#121212] text-gray-800 dark:text-gray-100 min-h-screen p-4 transition-colors duration-300">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- 顶部：标题与主题切换 -->
        <div class="flex justify-between items-center px-1">
            <h1 class="text-xl font-bold tracking-wider text-gold-light dark:text-gold-dark">Rolling-Wallet</h1>
            <button onclick="toggleDarkMode()" class="text-xs px-3 py-1.5 bg-gray-200 dark:bg-[#2A2A2A] rounded-full">
                ☀️ / 🌙
            </button>
        </div>

        <!-- 头部资产总额看板 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Left Balance (剩余总额)</span>
                <!-- 眼睛与铅笔功能按钮 -->
                <div class="flex items-center space-x-2">
                    <button id="eye-btn" onclick="toggleMask()" class="px-3 py-1.5 bg-gray-100 dark:bg-[#2A2A2A] rounded-xl text-xs font-medium active:scale-95 transition-transform">
                        👁️ 隐藏
                    </button>
                    <button onclick="editInitialBalance()" class="px-3 py-1.5 bg-gold-light/20 dark:bg-gold-dark/20 text-gold-light dark:text-gold-dark rounded-xl text-xs font-medium active:scale-95 transition-transform">
                        ✏️ 改本金
                    </button>
                </div>
            </div>
            <div id="balance-display" class="text-3xl font-bold text-gold-light dark:text-gold-dark">
                RM 0.00
            </div>
        </div>

        <!-- 添加流水表单 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">添加新流水</div>
            <input type="text" id="item-name" placeholder="项目名称 (e.g. 咖啡)" class="w-full px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
            <div class="flex space-x-2">
                <input type="number" id="item-amount" placeholder="金额 (e.g. 30)" class="w-1/2 px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                <select id="item-type" class="w-1/2 px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                    <option value="spend">支出 (Spend -)</option>
                    <option value="gain">收入 (Gain +)</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-400">日期:</span>
                <input type="date" id="item-date" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
            </div>
            <button onclick="addItem()" class="w-full py-3.5 bg-gold-light dark:bg-gold-dark text-white rounded-xl font-medium text-sm shadow-md active:scale-95 transition-transform">
                确认添加
            </button>
        </div>

        <!-- 📅 日历筛选与流水明细 -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="flex justify-between items-center">
                <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">流水明细与日历筛选</div>
                <div class="flex items-center space-x-1">
                    <input type="date" id="filter-date" onchange="onFilterDateChange()" class="px-2.5 py-1.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-lg text-xs border-none">
                    <button onclick="clearFilter()" class="text-xs text-gold-light dark:text-gold-dark px-1.5 py-1">重置</button>
                </div>
            </div>
            
            <div id="transaction-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- 动态生成的列表项 -->
            </div>
        </div>

    </div>

    <!-- 纯净原生 JavaScript 逻辑 -->
    <script>
        // 数据初始化
        let initialBalance = parseFloat(localStorage.getItem('rw_initial')) || 0;
        let transactions = JSON.parse(localStorage.getItem('rw_transactions')) || [];
        let isMasked = false;

        // 初始化日期设为今天
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('item-date').value = todayStr;
        document.getElementById('filter-date').value = todayStr;

        // 保存并刷新
        function saveData() {
            localStorage.setItem('rw_initial', initialBalance);
            localStorage.setItem('rw_transactions', JSON.stringify(transactions));
            render();
        }

        // 修改初始本金 (铅笔按钮)
        function editInitialBalance() {
            let val = prompt("请输入您的初始总金额 (Left Balance):", initialBalance);
            if (val !== null && val.trim() !== "" && !isNaN(val)) {
                initialBalance = parseFloat(val);
                saveData();
            }
        }

        // 切换隐私遮挡 (眼睛按钮)
        function toggleMask() {
            isMasked = !isMasked;
            let btn = document.getElementById('eye-btn');
            btn.textContent = isMasked ? '🔒 显示' : '👁️ 隐藏';
            render();
        }

        // 下方日历变动时，上方日期自动联动
        function onFilterDateChange() {
            let selectedDate = document.getElementById('filter-date').value;
            if (selectedDate) {
                document.getElementById('item-date').value = selectedDate;
            }
            render();
        }

        // 添加流水
        function addItem() {
            let name = document.getElementById('item-name').value.trim();
            let amount = parseFloat(document.getElementById('item-amount').value);
            let type = document.getElementById('item-type').value;
            let date = document.getElementById('item-date').value;

            if (!name || isNaN(amount) || amount <= 0) {
                alert("请输入有效的项目名称和大于0的金额！");
                return;
            }

            let newItem = {
                id: Date.now(),
                name,
                amount,
                type,
                date: date || todayStr
            };

            transactions.unshift(newItem);
            
            // 清空输入框
            document.getElementById('item-name').value = '';
            document.getElementById('item-amount').value = '';
            
            saveData();
        }

        // 删除流水
        function deleteItem(id) {
            transactions = transactions.filter(item => item.id !== id);
            saveData();
        }

        // 重置筛选
        function clearFilter() {
            document.getElementById('filter-date').value = todayStr;
            document.getElementById('item-date').value = todayStr;
            render();
        }

        // 核心渲染与计算
        function render() {
            let listContainer = document.getElementById('transaction-list');
            let filterDate = document.getElementById('filter-date').value;
            
            listContainer.innerHTML = '';

            // 计算当前总额 = 初始本金 + 所有收入 - 所有支出
            let currentBalance = initialBalance;
            transactions.forEach(item => {
                if (item.type === 'gain') {
                    currentBalance += item.amount;
                } else {
                    currentBalance -= item.amount;
                }
            });

            // 渲染总额显示
            let displayBalanceEl = document.getElementById('balance-display');
            if (isMasked) {
                displayBalanceEl.textContent = 'RM ••••••';
            } else {
                displayBalanceEl.textContent = `RM ${currentBalance.toFixed(2)}`;
            }

            // 根据日历筛选
            let filtered = filterDate ? transactions.filter(item => item.date === filterDate) : transactions;

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-4 text-xs text-gray-400">当天暂无流水记录</div>`;
                return;
            }

            // 渲染列表
            filtered.forEach(item => {
                let isGain = item.type === 'gain';
                let div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl text-sm";
                div.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="font-medium">${item.name}</div>
                        <div class="text-[10px] text-gray-400">${item.date}</div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-semibold ${isGain ? 'text-green-500' : 'text-red-500'}">
                            ${isGain ? '+' : '-'}RM ${item.amount.toFixed(2)}
                        </span>
                        <button onclick="deleteItem(${item.id})" class="text-gray-400 hover:text-red-500 text-xs p-1">🗑️</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        // 切换暗黑模式
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // 首次加载渲染
        render();
    </script>
</body>
</html>
