<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling-Wallet</title>
    
    <!-- 🌟 核心：为 Rolling-Wallet 自定义网页标签及手机桌面图标 (换成钱包图标) -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/money-bag.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/money-bag.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#C5A059', dark: '#AA7C11' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-[#121212] text-gray-800 dark:text-gray-100 min-h-screen p-4 transition-colors duration-300">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Header -->
        <div class="flex justify-between items-center px-1">
            <h1 class="text-xl font-bold tracking-wider text-gold-light dark:text-gold-dark">Rolling-Wallet</h1>
            <button onclick="toggleDarkMode()" class="text-xs px-3 py-1.5 bg-gray-200 dark:bg-[#2A2A2A] rounded-full">
                ☀️ / 🌙
            </button>
        </div>

        <!-- Left Balance Dashboard -->
        <div class="bg-white dark:bg-[#1E1E1E] p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Left Balance</span>
                <div class="flex items-center space-x-2">
                    <button id="eye-btn" onclick="toggleMask()" class="px-3 py-1.5 bg-gray-100 dark:bg-[#2A2A2A] rounded-xl text-xs font-medium active:scale-95 transition-transform">
                        👁️ Hide
                    </button>
                    <button onclick="editInitialBalance()" class="px-3 py-1.5 bg-gold-light/20 dark:bg-gold-dark/20 text-gold-light dark:text-gold-dark rounded-xl text-xs font-medium active:scale-95 transition-transform">
                        ✏️ Set Base
                    </button>
                </div>
            </div>
            <div id="balance-display" class="text-3xl font-bold text-gold-light dark:text-gold-dark">
                RM 0.00
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">Add Transaction</div>
            <input type="text" id="item-name" placeholder="Item Name (e.g. Coffee)" class="w-full px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
            <div class="flex space-x-2">
                <input type="number" id="item-amount" placeholder="Amount (e.g. 30)" class="w-1/2 px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                <select id="item-type" class="w-1/2 px-3 py-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm focus:ring-2 focus:ring-gold-light">
                    <option value="spend">Spend (-)</option>
                    <option value="gain">Gain (+)</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-400">Date:</span>
                <input type="date" id="item-date" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl border-none text-sm">
            </div>
            <button onclick="addItem()" class="w-full py-3.5 bg-gold-light dark:bg-gold-dark text-white rounded-xl font-medium text-sm shadow-md active:scale-95 transition-transform">
                Confirm Add
            </button>
        </div>

        <!-- Calendar Filter & History List -->
        <div class="bg-white dark:bg-[#1E1E1E] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 space-y-3">
            <div class="flex justify-between items-center">
                <div class="font-medium text-xs text-gray-400 uppercase tracking-wider">History & Calendar</div>
                <div class="flex items-center space-x-2">
                    <input type="date" id="filter-date" onchange="onFilterDateChange()" class="px-2 py-1 bg-gray-50 dark:bg-[#2A2A2A] rounded-lg text-xs border-none">
                    <button onclick="showAllHistoryRecords()" class="text-xs bg-gold-light/20 text-gold-light dark:text-gold-dark px-2 py-1 rounded-lg font-medium active:scale-95 transition-transform">
                        All
                    </button>
                    <button onclick="resetToToday()" class="text-xs text-gray-400 hover:text-gray-200 px-1 py-1">
                        Today
                    </button>
                </div>
            </div>
            
            <div id="transaction-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Dynamic Items -->
            </div>
        </div>

    </div>

    <!-- Core JavaScript -->
    <script>
        let initialBalance = parseFloat(localStorage.getItem('rw_initial')) || 0;
        let transactions = JSON.parse(localStorage.getItem('rw_transactions')) || [];
        let isMasked = false;
        let viewingAll = true;

        function getRealToday() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        window.onload = function() {
            let today = getRealToday();
            document.getElementById('item-date').value = today;
            checkMonthlyRollover();
            render();
        };

        function saveData() {
            localStorage.setItem('rw_initial', initialBalance);
            localStorage.setItem('rw_transactions', JSON.stringify(transactions));
            render();
        }

        function checkMonthlyRollover() {
            if (transactions.length === 0) return;
            let today = getRealToday();
            let currentMonth = today.substring(0, 7);
            let lastMonth = localStorage.getItem('rw_last_month') || currentMonth;

            if (currentMonth > lastMonth) {
                let prevBalance = initialBalance;
                transactions.forEach(t => {
                    if (t.date.startsWith(lastMonth)) {
                        if (t.type === 'gain') prevBalance += t.amount;
                        else prevBalance -= t.amount;
                    }
                });

                if (prevBalance > 0) {
                    let rolloverDate = currentMonth + "-01";
                    let exists = transactions.some(t => t.date === rolloverDate && t.name.includes("Rollover"));
                    if (!exists) {
                        transactions.unshift({
                            id: Date.now(),
                            name: `Previous Month Rollover (${lastMonth})`,
                            amount: prevBalance,
                            type: 'gain',
                            date: rolloverDate
                        });
                    }
                }
                localStorage.setItem('rw_last_month', currentMonth);
                localStorage.setItem('rw_transactions', JSON.stringify(transactions));
            } else {
                localStorage.setItem('rw_last_month', currentMonth);
            }
        }

        function editInitialBalance() {
            let val = prompt("Enter your initial base balance:", initialBalance);
            if (val !== null && val.trim() !== "" && !isNaN(val)) {
                initialBalance = parseFloat(val);
                saveData();
            }
        }

        function toggleMask() {
            isMasked = !isMasked;
            document.getElementById('eye-btn').textContent = isMasked ? '🔒 Show' : '👁️ Hide';
            render();
        }

        function onFilterDateChange() {
            viewingAll = false;
            let selectedDate = document.getElementById('filter-date').value;
            if (selectedDate) {
                document.getElementById('item-date').value = selectedDate;
            }
            render();
        }

        function showAllHistoryRecords() {
            viewingAll = true;
            render();
        }

        function resetToToday() {
            let realToday = getRealToday();
            document.getElementById('filter-date').value = realToday;
            document.getElementById('item-date').value = realToday;
            viewingAll = false;
            render();
        }

        function addItem() {
            let name = document.getElementById('item-name').value.trim();
            let amount = parseFloat(document.getElementById('item-amount').value);
            let type = document.getElementById('item-type').value;
            let date = document.getElementById('item-date').value;

            if (!name || isNaN(amount) || amount <= 0) {
                alert("Please enter a valid item name and amount > 0!");
                return;
            }

            transactions.unshift({
                id: Date.now(),
                name,
                amount,
                type,
                date: date || getRealToday()
            });

            document.getElementById('item-name').value = '';
            document.getElementById('item-amount').value = '';
            saveData();
        }

        function editItemAmount(id) {
            let item = transactions.find(t => t.id === id);
            if (!item) return;

            let val = prompt(`Edit amount for "${item.name}":`, item.amount);
            if (val !== null && val.trim() !== "" && !isNaN(val)) {
                let newAmount = parseFloat(val);
                if (newAmount > 0) {
                    item.amount = newAmount;
                    saveData();
                } else {
                    alert("Amount must be > 0!");
                }
            }
        }

        function deleteItem(id) {
            transactions = transactions.filter(item => item.id !== id);
            saveData();
        }

        function render() {
            let listContainer = document.getElementById('transaction-list');
            let filterDate = document.getElementById('filter-date').value;
            listContainer.innerHTML = '';

            let currentBalance = initialBalance;
            transactions.forEach(t => {
                if (t.type === 'gain') currentBalance += t.amount;
                else currentBalance -= t.amount;
            });

            let displayBalanceEl = document.getElementById('balance-display');
            displayBalanceEl.textContent = isMasked ? 'RM ••••••' : `RM ${currentBalance.toFixed(2)}`;

            let filtered = viewingAll ? transactions : (filterDate ? transactions.filter(t => t.date === filterDate) : transactions);

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-4 text-xs text-gray-400">No records found</div>`;
                return;
            }

            filtered.forEach(item => {
                let isGain = item.type === 'gain';
                let div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-gray-50 dark:bg-[#2A2A2A] rounded-xl text-sm";
                div.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="font-medium">${item.name}</div>
                        <div class="text-[10px] text-gray-400">${item.date}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold ${isGain ? 'text-green-500' : 'text-red-500'}">
                            ${isGain ? '+' : '-'}RM ${item.amount.toFixed(2)}
                        </span>
                        <button onclick="editItemAmount(${item.id})" class="text-gray-400 hover:text-gold-light text-xs p-1" title="Edit">✏️</button>
                        <button onclick="deleteItem(${item.id})" class="text-gray-400 hover:text-red-500 text-xs p-1" title="Delete">🗑️</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
